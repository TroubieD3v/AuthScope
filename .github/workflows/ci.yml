name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci && npm run build
        working-directory: frontend
      - run: pip install -e ".[dev]" && playwright install --with-deps chromium
      - run: pytest -m e2e -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
  # Example of using AuthScope as an authorization regression gate: the secure demo must stay clean.
  authz-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: |
          DEMO_VULNS= python -m demo_api &
          sleep 3
          set -a; . examples/demo.env; set +a
          authscope run -c examples/demo.authscope.yaml -f md -o authz-report.md
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: authz-report, path: authz-report.md }
